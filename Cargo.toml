[workspace]
members = [
  "crates/borsuk",
  "crates/borsuk-v41",
  "crates/borsuk-v71",
  "crates/borsuk-v25",
  "crates/borsuk-v26",
  "crates/borsuk-fma",
  "crates/borsuk-pq4",
  "crates/borsuk-cli",
  "crates/borsuk-node",
  "crates/borsuk-python",
]
resolver = "3"
exclude = ["vendor/object_store-0.14.1"]

[workspace.package]
edition = "2024"
repository = "https://github.com/CausalityHQ/borsuk"
homepage = "http://causality.pl/borsuk/"
documentation = "https://docs.rs/borsuk"
rust-version = "1.91"

[workspace.lints.rust]
missing_docs = "warn"

[workspace.lints.clippy]
all = "warn"

[profile.test]
debug = 0
incremental = false
split-debuginfo = "off"

[patch.crates-io]
# Keep registry dependencies in this workspace (borsuk-v71) on the same storage API.
object_store = { path = "vendor/object_store-0.14.1" }
